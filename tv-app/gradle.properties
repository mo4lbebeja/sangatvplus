org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# --- SangaTV Plus build settings (override in ~/.gradle/gradle.properties or with -P) ---
# Debug: emulator reaches the host's `php artisan serve --host 0.0.0.0` at 10.0.2.2.
sangatv.debugApiBaseUrl=http://10.0.2.2:8000/
# Release: HTTPS server behind the internal CA. Required for release builds.
sangatv.releaseApiBaseUrl=
# Release: comma-separated OkHttp pins, e.g. sha256/AAAA...=,sha256/BBBB...= (current + backup key).
sangatv.certPins=
