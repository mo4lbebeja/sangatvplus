# --- SangaTV Plus build settings (override in ~/.gradle/gradle.properties or with -P) ---
# Debug: emulator reaches the host's `php artisan serve --host 0.0.0.0` at 10.0.2.2.
sangatv.debugApiBaseUrl=http://10.0.2.2:8000/
# Release: HTTPS server behind the internal CA. Required for release builds.
# Release build: production API (HTTPS only).
sangatv.releaseApiBaseUrl=https://sangatvplus.sijalucom.online/
# Release: comma-separated OkHttp pins, e.g. sha256/AAAA...=,sha256/BBBB...= (current + backup key).
# Pins on Let's Encrypt ROOTS (stable for years, survive every 90-day certificate renewal):
# ISRG Root YR (current chain), ISRG Root X1 (cross-sign, valid to 2035), ISRG Root X2 (backup, to 2040).
sangatv.certPins=sha256/fk6IOKit1ild5647BH06ujSIq5XbCgqlbYl6ANhhi88=,sha256/C5+lpZ7tcVwmwQIMcRtPbsQtWLABXhQzejna0wHFr8M=,sha256/diGVwiVYbubAI3RW4hB9xU8e/CH2GnkuvVFZE8zmgzI=
