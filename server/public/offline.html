<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#061A2B">
<title>Offline · SangaTV Plus</title>
<link rel="stylesheet" href="/css/sangatv-fonts.css">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
    background: radial-gradient(1200px 600px at 80% -10%, #0B3D66 0%, transparent 60%), #061A2B;
    color: #F2F8FB; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
  .card { width: 100%; max-width: 440px; text-align: center; padding: 40px 32px; border-radius: 20px;
    background: rgba(12, 43, 69, .7); border: 1px solid rgba(56, 198, 217, .18); backdrop-filter: blur(12px); }
  img { width: 72px; height: 72px; border-radius: 18px; }
  .brand { margin-top: 18px; font-family: 'Michroma', sans-serif; letter-spacing: .18em; font-size: 13px; color: #D6BA80; }
  h1 { margin: 14px 0 8px; font-size: 22px; font-weight: 700; }
  p { margin: 0 0 24px; color: #9DB9CF; line-height: 1.6; font-size: 14px; }
  button { border: 0; border-radius: 12px; padding: 12px 22px; font: 600 14px inherit; font-family: inherit; cursor: pointer;
    color: #04232D; background: linear-gradient(135deg, #5FD6E6, #38C6D9 55%, #2AA7BB); }
  button:focus-visible { outline: 3px solid #D6BA80; outline-offset: 3px; }
</style>
</head>
<body>
  <main class="card">
    <img src="/icons/icon-192.png" alt="">
    <div class="brand">SANGATV PLUS</div>
    <h1>Tidak ada koneksi</h1>
    <p>CMS membutuhkan koneksi ke server hotel. Periksa jaringan Anda, lalu coba lagi.</p>
    <button type="button" onclick="location.reload()">Coba lagi</button>
  </main>
</body>
</html>
